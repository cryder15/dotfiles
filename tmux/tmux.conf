unbind C-b
set -g prefix C-s
bind-key C-s send-prefix
set -g allow-passthrough on
set -g mouse on

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -s escape-time 10
set-option -g focus-events on

set -g status-position top
set -g status-style "bg=#1c1c1c"
set -g status-justify left

set -g status-left ""
set -g status-right-length 100
set -g status-right "#[fg=#ff9e64,bg=#1c1c1c]#[fg=#1c1c1c,bg=#ff9e64,bold] #S #[fg=#2a2b3d,bg=#ff9e64,nobold]#[fg=#d0d0d0,bg=#2a2b3d] #{b:pane_current_path} #[fg=#45475a,bg=#2a2b3d]#[fg=#d0d0d0,bg=#45475a] #{pane_current_command} "

set -g window-status-format "#[fg=#2a2b3d,bg=#1c1c1c]#[fg=#6c7086,bg=#2a2b3d] #I: #W #[fg=#2a2b3d,bg=#1c1c1c]"
set -g window-status-current-format "#[fg=#ff9e64,bg=#1c1c1c]#[fg=#1c1c1c,bg=#ff9e64] #I: #W #[fg=#ff9e64,bg=#1c1c1c]"

set -g window-status-separator " "

set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#ff9e64"

set -g message-style "fg=#d0d0d0,bg=#2a2b3d"
set -g message-command-style "fg=#d0d0d0,bg=#2a2b3d"

bind x kill-pane
bind & kill-window

# Pass C-hjkl through to vim when a vim-like process owns the pane, otherwise
# move between tmux panes. Pairs with christoomey/vim-tmux-navigator in nvim.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind -n 'C-\' if-shell "$is_vim" 'send-keys C-\\' 'select-pane -l'

bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R
bind -T copy-mode-vi 'C-\' select-pane -l

bind C-l send-keys C-l
